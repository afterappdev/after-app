<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Allow pinch-zoom. Do not set user-scalable=no or maximum-scale=1. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encontre restaurantes, bares, casas de show e promoções do dia na sua cidade.">
  <style>
    /* Flutter full-page embedding sets inline touch-action:none on body,
       which blocks native pinch-zoom even with a correct viewport. */
    html, body {
      touch-action: pan-x pan-y pinch-zoom !important;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="After">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>After | O que temos pra hoje?</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Flutter Web replaces any viewport meta on bootstrap (flt-viewport).
    // Keep pinch-zoom allowed if the engine injects user-scalable=no or
    // maximum-scale=1. Flutter 3.47 already uses maximum-scale=5.0.
    (function () {
      var allowed = 'width=device-width, initial-scale=1.0, maximum-scale=5.0';
      var locked = /user-scalable\s*=\s*no/i;
      var maxOne = /maximum-scale\s*=\s*1(\.0)?\b/i;
      function unlockViewport() {
        var tags = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < tags.length; i++) {
          var content = tags[i].getAttribute('content') || '';
          if (locked.test(content) || maxOne.test(content)) {
            tags[i].setAttribute('content', allowed);
          }
        }
        if (document.documentElement) {
          document.documentElement.style.setProperty('touch-action', 'pan-x pan-y pinch-zoom', 'important');
        }
        if (document.body) {
          document.body.style.setProperty('touch-action', 'pan-x pan-y pinch-zoom', 'important');
        }
      }
      var observer = new MutationObserver(unlockViewport);
      if (document.head) {
        observer.observe(document.head, { childList: true, subtree: true, attributes: true });
      }
      document.addEventListener('DOMContentLoaded', unlockViewport);
      window.addEventListener('load', unlockViewport);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
