<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encontre restaurantes, bares, casas de show e promoções do dia na sua cidade.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="After">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>After | O que tem pra hoje?</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function () {
      function normalize(path) {
        var value = path || '/';
        value = value.replace(/\/index\.html$/i, '');
        if (value.length > 1 && value.charAt(value.length - 1) === '/') {
          value = value.slice(0, -1);
        }
        return value || '/';
      }

      function loadApp() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      if (normalize(location.pathname) !== '/baixar') {
        loadApp();
        return;
      }

      fetch('/baixar/index.html', { credentials: 'same-origin' })
        .then(function (response) {
          if (!response.ok) throw new Error('missing');
          return response.text();
        })
        .then(function (html) {
          if (html.indexOf('name="after-download-page"') === -1) {
            loadApp();
            return;
          }
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          loadApp();
        });
    })();
  </script>
</body>
</html>
