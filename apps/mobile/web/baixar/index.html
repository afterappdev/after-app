<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="after-download-page" content="1">
  <meta name="theme-color" content="#ffffff">
  <title>After - O que tem pra hoje?</title>
  <meta name="description" content="Descubra bares, restaurantes, pubs, eventos e muito mais perto de você.">
  <base href="/baixar/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preload" href="fonts/Montserrat-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Montserrat-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: Montserrat;
      src: url("fonts/Montserrat-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: Montserrat;
      src: url("fonts/Montserrat-ExtraBold.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --ink: #2f0854;
      --orange: #ff6600;
      --muted: #5e546c;
      --whatsapp: #01b460;
      --line: #d4c2e6;
      --col: 430px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #fff;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      font-family: Montserrat, "Segoe UI", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    .frame {
      width: min(var(--col), 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background: #fff;
      container-type: inline-size;
    }

    .sheet {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(10px + env(safe-area-inset-top)) 18px 0;
    }

    .logo {
      width: 86%;
      max-width: 348px;
      height: auto;
      display: block;
      margin-top: 4px;
    }

    h1 {
      margin: 12px 0 0;
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    h1 .orange { color: var(--orange); }

    .subtitle {
      margin: 12px 0 0;
      max-width: 22em;
      text-align: center;
      color: var(--muted);
      font-size: 17.5px;
      font-weight: 400;
      line-height: 1.55;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 22px;
      padding: 0 12px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 88px;
      padding: 16px 18px;
      border-radius: 22px;
      text-decoration: none;
      color: #fff;
      background: #000;
      -webkit-tap-highlight-color: transparent;
    }

    .card:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .card-icon {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
    }

    .card-icon svg,
    .card-icon img { display: block; width: 48px; height: 48px; }

    #app-store .card-icon svg {
      width: 74px;
      height: 74px;
      margin: -13px;
    }

    #open-browser .card-icon img {
      width: 54px;
      height: 54px;
      margin: -3px;
      object-fit: contain;
    }

    .card-copy {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.12;
    }

    .kicker {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .name {
      margin-top: 2px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .lines {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.03em;
    }

    .chevron {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
    }

    .card-browser {
      background: #fff;
      color: var(--ink);
      border: 1.5px solid var(--line);
    }

    .card-whatsapp { background: var(--whatsapp); }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      width: 100%;
    }

    .footer svg {
      display: block;
      width: 100%;
      height: 136px;
    }

    .copy {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      margin: 0;
      text-align: center;
      color: #fff;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
    }

    @container (max-width: 340px) {
      .sheet { padding-left: 14px; padding-right: 14px; }
      .logo { max-width: 300px; }
      h1 { font-size: 28px; }
      .subtitle { font-size: 16px; }
      .card { min-height: 82px; padding: 14px 14px; gap: 12px; border-radius: 18px; }
      .kicker { font-size: 12px; }
      .name { font-size: 21px; }
      .lines { font-size: 18px; }
      .card-icon, .card-icon svg, .card-icon img { width: 42px; height: 42px; }
      #app-store .card-icon svg { width: 62px; height: 62px; margin: -10px; }
      #open-browser .card-icon img { width: 48px; height: 48px; margin: -3px; object-fit: contain; }
      .chevron { width: 26px; height: 26px; }
      .copy { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <main class="sheet">
      <img class="logo" src="logo_after.png" alt="After" width="840" height="383">
      <h1><span>O que tem</span> <span class="orange">pra hoje?</span></h1>
      <p class="subtitle">Descubra bares, restaurantes, pubs,<br>eventos e muito mais perto de você.</p>

      <div class="actions">
        <a class="card" id="google-play" role="link" tabindex="0">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 28.99 31.99">
              <path fill="#ea4335" d="M13.54 15.28.12 29.34a3.66 3.66 0 0 0 5.33 2.16l15.1-8.6Z"/>
              <path fill="#fbbc04" d="m27.11 12.89-6.53-3.74-7.35 6.45 7.38 7.28 6.48-3.7a3.54 3.54 0 0 0 1.5-4.79 3.62 3.62 0 0 0-1.5-1.5z"/>
              <path fill="#4285f4" d="M.12 2.66a3.57 3.57 0 0 0-.12.92v24.84a3.57 3.57 0 0 0 .12.92L14 15.64Z"/>
              <path fill="#34a853" d="m13.64 16 6.94-6.85L5.5.51A3.73 3.73 0 0 0 3.63 0 3.64 3.64 0 0 0 .12 2.65Z"/>
            </svg>
          </span>
          <span class="card-copy">
            <span class="kicker">BAIXE PELO</span>
            <span class="name">Google Play</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a class="card" id="app-store" role="link" tabindex="0">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path fill="#fff" d="M16.4 12.7c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.6.8-3.3.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.9-3.6 2.2-1.5 2.7-.4 6.6 1.1 8.8.7 1.1 1.6 2.2 2.8 2.2 1.1 0 1.5-.7 2.8-.7s1.7.7 2.9.7 1.9-1.1 2.6-2.1c.8-1.2 1.2-2.4 1.2-2.4s-2.3-.9-2.4-3.7zM14.7 6.8c.6-.7 1-1.8.9-2.8-.9 0-1.9.6-2.5 1.3-.5.7-1 1.7-.9 2.7 1 .1 1.9-.5 2.5-1.2z"/>
            </svg>
          </span>
          <span class="card-copy">
            <span class="kicker">BAIXE PELA</span>
            <span class="name">App Store</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a class="card card-browser" id="open-browser" href="https://app-after.com.br">
          <span class="card-icon" aria-hidden="true">
            <img src="icon_after.png" alt="" width="48" height="48">
          </span>
          <span class="lines">
            <span>Acesse nosso site</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="#2f0854" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <a class="card card-whatsapp" id="whatsapp" href="https://wa.me/5517996470194">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path fill="#fff" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.41a10 10 0 0 0 4.65 1.18h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 13.92c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.81-.11-.41-.14-.95-.31-1.64-.61-2.88-1.25-4.76-4.15-4.9-4.34-.14-.2-1.16-1.54-1.16-2.94s.73-2.08 1-2.37c.26-.28.57-.35.76-.35h.55c.17 0 .41-.07.64.49.24.58.82 2 .89 2.15.07.14.12.32.02.51-.09.2-.14.32-.28.49-.14.17-.29.38-.42.51-.14.14-.28.29-.12.56.16.28.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.21 1.36.28.14.44.12.6-.07.17-.2.7-.81.89-1.09.19-.28.38-.23.64-.14.26.09 1.66.78 1.94.92.28.14.47.21.54.33.07.12.07.68-.17 1.36z"/>
            </svg>
          </span>
          <span class="lines">
            <span>WhatsApp</span>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6l6 6-6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </main>

    <footer class="footer">
      <svg viewBox="0 0 430 136" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff8a1c"/>
            <stop offset="34%" stop-color="#ff3d78"/>
            <stop offset="66%" stop-color="#e218c8"/>
            <stop offset="100%" stop-color="#6a22f5"/>
          </linearGradient>
          <linearGradient id="waveB" x1="0" y1="0" x2="1" y2=".35">
            <stop offset="0%" stop-color="#ff6a2a"/>
            <stop offset="46%" stop-color="#ff2e9a"/>
            <stop offset="100%" stop-color="#6418ee"/>
          </linearGradient>
          <linearGradient id="waveC" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff5a3c"/>
            <stop offset="40%" stop-color="#ff2d8a"/>
            <stop offset="100%" stop-color="#4d14d6"/>
          </linearGradient>
        </defs>
        <path fill="url(#waveA)" d="M0 18C72-6 130 42 210 14c72-26 118-8 160 10 22 10 40 6 60 12v100H0V18z"/>
        <path fill="url(#waveB)" d="M0 42c80-16 128 24 210 6 70-16 120 6 150 2 18-2 42 6 70 8v78H0V42z"/>
        <path fill="url(#waveC)" d="M0 64c88-12 132 18 214 6 74-12 112 10 146 4 16-2 40 4 70 6v56H0V64z"/>
      </svg>
      <p class="copy">© 2026 After. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script>
    const googlePlayUrl = '';
    const appStoreUrl = '';

    function bindStore(id, url) {
      var link = document.getElementById(id);
      var destination = (url || '').trim();
      if (!destination) {
        link.setAttribute('aria-disabled', 'true');
        link.addEventListener('click', function (event) {
          event.preventDefault();
        });
        link.addEventListener('keydown', function (event) {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
        });
        return;
      }
      link.href = destination;
      link.removeAttribute('aria-disabled');
    }

    bindStore('google-play', googlePlayUrl);
    bindStore('app-store', appStoreUrl);
  </script>
</body>
</html>
